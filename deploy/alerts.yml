# Алерты. Пороги подобраны под CPU-машину: ответ за 2-3 минуты тут норма.
groups:
  - name: movie-agents
    rules:
      - alert: AgentDown
        expr: up{job="agent"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Сервис агента не отвечает

      - alert: OllamaDown
        expr: ollama_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Агент не может достучаться до Ollama

      - alert: HighErrorRate
        expr: sum(rate(agent_errors_total{stage="graph"}[10m])) / clamp_min(sum(rate(agent_requests_total[10m])), 0.001) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Больше 10% запросов падают с ошибкой

      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_request_latency_seconds_bucket[15m]))) > 300
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: p95 времени ответа больше 5 минут

      - alert: HallucinationSpike
        expr: increase(hallucinated_titles_total[30m]) > 5
        labels: {severity: warning}
        annotations:
          summary: Модели часто выдумывают фильмы (валидатор ловит, но растут доработки и задержка)

      - alert: ValidatorRejectsTooMuch
        expr: sum(rate(validator_verdicts_total{verdict="fail"}[30m])) / clamp_min(sum(rate(validator_verdicts_total[30m])), 0.001) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Валидатор отклоняет больше половины ответов, проверьте модели и промпты

      - alert: FallbackAnswers
        expr: increase(agent_errors_total{stage="validation_exhausted"}[1h]) > 3
        labels: {severity: info}
        annotations:
          summary: Агенты не справляются, пользователь получает ответы-заглушки из инструментов

      - alert: InjectionAttempts
        expr: increase(gate_decisions_total{intent="unsafe"}[10m]) > 10
        labels: {severity: warning}
        annotations:
          summary: Много попыток prompt injection за 10 минут
