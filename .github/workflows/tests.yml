name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Датасет MovieLens (около 1 МБ) кэшируется между запусками.
      - uses: actions/cache@v5
        with:
          path: data/ml-latest-small
          key: movielens-small

      - run: pip install -r requirements.txt

      # LLM в тестах не нужна: она заменяется фальшивой.
      - run: pytest -v
